# Coolify-compatible compose. It mirrors docker-compose.yml but with the
# one change on THIS host: the frontend is published on 127.0.0.1:8180
# (8080 is taken) and the host's nginx proxies the public domain to it.
#
# Build pack in Coolify: "Docker Compose", file: docker-compose.coolify.yml

x-frappe: &frappe
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      ERPNEXT_TAG: ${ERPNEXT_TAG:-version-15}
  image: expense-ledger-frappe
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    - app-code:/home/frappe/frappe-bench/apps/expense_ledger

x-ingest: &ingest
  build:
    context: .
    dockerfile: ingestion/Dockerfile
  image: expense-ledger-ingest
  restart: unless-stopped
  environment:
    FRAPPE_URL: http://frontend:8080
    FRAPPE_API_KEY: ${FRAPPE_API_KEY:-}
    FRAPPE_API_SECRET: ${FRAPPE_API_SECRET:-}
    INBOX_DIR: /inbox
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
  volumes:
    - ./inbox:/inbox
  depends_on: [frontend]

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  configurator:
    <<: *frappe
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    depends_on: [db, redis-cache, redis-queue]

  create-site:
    <<: *frappe
    restart: "no"
    entrypoint: [bash, -c]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    command:
      - >
        test -d sites/frontend && exit 0;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        for i in $$(seq 40); do jq -e '.db_host and .redis_cache and .redis_queue' sites/common_site_config.json >/dev/null 2>&1 && break; sleep 3; done;
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --db-host=db --db-port=3306 --install-app erpnext --install-app expense_ledger --set-default frontend;
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *frappe
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: *frappe
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *frappe
    command: [bench, schedule]
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue:
    <<: *frappe
    command: [bench, worker, --queue, "short,default,long"]
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *frappe
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8180:8080"  # host nginx proxies the domain here (see COOLIFY-DEPLOYMENT.md)
    depends_on: [backend, websocket]

  watcher:
    <<: *ingest
    command: [python, -m, ingestion.watcher]

  bot:
    <<: *ingest
    command: [python, -m, ingestion.bot]

volumes:
  sites:
  logs:
  db-data:
  app-code:
