# Local stack: ERPNext (Frappe v15) with the expense_ledger app, plus the ingestion services.
# All data (database, site files, logs) lives in ./data, see scripts/dev.sh up.
# Adapted from frappe_docker's pwd.yml. Site name is "frontend"; UI on http://localhost:8080.

x-frappe: &frappe
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      ERPNEXT_TAG: ${ERPNEXT_TAG:-version-15}
  image: expense-ledger-frappe
  restart: unless-stopped
  volumes:
    - ./data/sites:/home/frappe/frappe-bench/sites
    - ./data/logs:/home/frappe/frappe-bench/logs
    # app code lives in a volume so in-app upgrades survive container recreation
    - app-code:/home/frappe/frappe-bench/apps/expense_ledger

x-ingest: &ingest
  build:
    context: .
    dockerfile: ingestion/Dockerfile
  image: expense-ledger-ingest
  restart: unless-stopped
  env_file: .env
  environment:
    FRAPPE_URL: http://frontend:8080
    INBOX_DIR: /inbox
  volumes:
    - ./inbox:/inbox
  depends_on: [frontend]

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - ./data/db:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  configurator:
    <<: *frappe
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    depends_on: [db, redis-cache, redis-queue]

  create-site:
    <<: *frappe
    restart: "no"
    entrypoint: [bash, -c]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    command:
      - >
        test -d sites/frontend && exit 0;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        for i in $$(seq 40); do jq -e '.db_host and .redis_cache and .redis_queue' sites/common_site_config.json >/dev/null 2>&1 && break; sleep 3; done;
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --install-app expense_ledger --set-default frontend;
    depends_on: [configurator]

  backend:
    <<: *frappe
    depends_on: [configurator]

  websocket:
    <<: *frappe
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on: [configurator]

  scheduler:
    <<: *frappe
    command: [bench, schedule]
    depends_on: [configurator]

  queue:
    <<: *frappe
    command: [bench, worker, --queue, "short,default,long"]
    depends_on: [configurator]

  frontend:
    <<: *frappe
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "8080:8080"
    depends_on: [backend, websocket]

  watcher:
    <<: *ingest
    profiles: [ingest]
    command: [python, -m, ingestion.watcher]

  bot:
    <<: *ingest
    profiles: [telegram]
    command: [python, -m, ingestion.bot]

volumes:
  app-code:  # code, not data: a bind mount would hide the app baked into the image
